; Overrides layered on top of php.ini-development.
; Loaded last (zz- prefix) so these win.

; CRITICAL: php.ini-development ships variables_order = "GPCS" -- no E -- which
; leaves $_ENV empty. api/config/bootstrap.php reads $_ENV, and in containers the
; configuration arrives as real environment variables rather than a .env file, so
; E must be present or every DB setting silently falls back to its default.
variables_order = "EGPCS"

; Don't advertise the PHP version. nginx also strips X-Powered-By at the edge
; (which is what catches Restler's hardcoded one); this is defence in depth for
; any path that doesn't go through nginx.
expose_php = Off

memory_limit = 256M
max_execution_time = 30

; Dev-facing error behaviour. A production image would flip display_errors to Off
; and leave log_errors on.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; Uploads: modest ceiling, this is a JSON API not a file host.
upload_max_filesize = 8M
post_max_size = 8M

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Dev setting: pick up edited files without a container restart. Production
; should set this to 0 and rely on deploys to invalidate.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
