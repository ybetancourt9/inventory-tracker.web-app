; Overrides layered on top of php.ini-development. Loaded last (zz- prefix).

; Required: php.ini-development ships "GPCS" with no E, which leaves $_ENV empty
; and silently breaks every setting bootstrap.php reads from it.
variables_order = "EGPCS"

expose_php = Off

memory_limit = 256M
max_execution_time = 30

; Dev values; production flips display_errors to Off.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

upload_max_filesize = 8M
post_max_size = 8M

date.timezone = UTC

[apcu]
apc.enabled = 1
apc.shm_size = 32M
; Off in CLI: each command would get its own empty cache, which is misleading.
apc.enable_cli = 0

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Dev setting: picks up edited files without a restart. Set to 0 in production.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
