; Overrides layered on top of php.ini-production. Loaded last (zz- prefix).

; Required: the stock ini ships "GPCS" with no E, which leaves $_ENV empty
; and silently breaks every setting bootstrap.php reads from it.
variables_order = "EGPCS"

expose_php = Off

memory_limit = 256M
max_execution_time = 30

; Errors go to the container log, never to the client.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /proc/self/fd/2

upload_max_filesize = 8M
post_max_size = 8M

date.timezone = UTC

[apcu]
apc.enabled = 1
apc.shm_size = 32M
apc.enable_cli = 0

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; The source is baked into the image and cannot change under a running
; container, so skip the per-request stat.
opcache.validate_timestamps = 0
