services:
  db:
    image: mysql:8.0.40
    container_name: inventory-tracker-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${DB_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: inventory-tracker-api:local
    container_name: inventory-tracker-api
    restart: unless-stopped
    # Configuration is injected as real environment variables rather than read
    # from a file inside the container -- the same mechanism ECS task
    # definitions and Elastic Beanstalk use, so local and AWS differ only in
    # where the values come from.
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      # NOT 127.0.0.1: inside the compose network the database is reachable by
      # its service name. The .env value is correct for host-side tools only.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-inventory-tracker-api}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    volumes:
      # Bind mount for development: edits on the host are live, no rebuild.
      # A production image bakes the source in instead.
      - ./api:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    # No ports: php-fpm speaks FastCGI, not HTTP, and is reachable only from
    # the nginx container on the internal network. Nothing to expose.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_mysql') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.30.4-alpine
    container_name: inventory-tracker-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx resolves try_files against the real filesystem, so it needs the
      # same source tree at the same path php-fpm sees. Read-only: the web
      # server has no business writing to application code.
      - ./api:/var/www/html:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    name: inventory-tracker-db-data
