services:
  db:
    image: mysql:8.0.46
    container_name: inventory-tracker-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${DB_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    image: inventory-tracker-api:local
    container_name: inventory-tracker-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      # Service name, not the .env value: 127.0.0.1 is only correct host-side.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-inventory-tracker-api}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    volumes:
      # Dev bind mount; a production image bakes the source in.
      - ./api:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    # No ports: php-fpm speaks FastCGI and is reachable only from nginx.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_mysql') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.30.4-alpine
    container_name: inventory-tracker-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      # try_files resolves against the filesystem, so nginx needs the same tree
      # at the same path php-fpm sees.
      - ./api:/var/www/html:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    image: node:24.18.0-alpine
    container_name: inventory-tracker-client
    working_dir: /app
    # --poll: inotify does not fire for host edits through a Windows bind mount.
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "127.0.0.1:${CLIENT_PORT:-4200}:4200"
    volumes:
      - ./web:/app
      # Keeps node_modules off the bind mount, which is slow on Windows and
      # would collide with any host-installed copy.
      - client-node-modules:/app/node_modules
    depends_on:
      - web

volumes:
  db-data:
    name: inventory-tracker-db-data
  client-node-modules:
    name: inventory-tracker-client-node-modules
