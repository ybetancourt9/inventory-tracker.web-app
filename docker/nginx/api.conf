server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    charset utf-8;

    default_type application/json;

    client_max_body_size 8M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Don't advertise the exact nginx patch version in responses.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        internal;

        include fastcgi_params;
        fastcgi_pass api:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other .php path is refused outright rather than executed. Stops
    # uploaded-file execution and stray scripts from becoming entry points.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles (.env, .git, editor leftovers) are never served.
    location ~ /\. {
        deny all;
    }
}
