server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    charset utf-8;

    client_max_body_size 8M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server_tokens off;

    # Caddy terminates TLS in front of this, so without these the rate limiter
    # would see Caddy's address for every request and all callers would share
    # one bucket. Only the compose network can reach this container, so the
    # header cannot be spoofed from outside.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serving the client and the API from one origin is what keeps CORS off.
    # The capture strips the /api prefix the API itself knows nothing about.
    location ~ ^/api/(?<apipath>.*)$ {
        include fastcgi_params;
        fastcgi_pass api:9000;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param PATH_INFO       /$apipath;
        fastcgi_param REQUEST_URI     /$apipath$is_args$args;

        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Content-hashed filenames, so they can never go stale.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
